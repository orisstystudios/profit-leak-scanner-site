<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit Leak Scanner — by Orissty Studios</title>
<style>
  :root{ --paper:#F5F7F0; --bond:#FFFFFF; --ink:#1E2D36; --muted:#46525A;
         --rule:#D9E0D2; --red:#B42318; --blue:#2F5A87; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:24px}
  main{max-width:560px;background:var(--bond);border:1px solid var(--rule);border-radius:3px;
       padding:36px 40px;text-align:center}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-size:28px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:11px 18px;border:1px solid var(--ink);border-radius:3px;
    color:var(--ink);font-weight:600;text-decoration:none}
  a.primary{background:var(--ink);color:var(--bond)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Orissty Studios</p>
  <h1>Profit Leak Scanner</h1>
  <p>A Shopify app that shows where your store is leaking profit — with the evidence and
  the math behind every finding.</p>
  <div class="links">
    <a class="primary" href="./support.html">Support</a>
    <a href="./privacy-policy.html">Privacy policy</a>
  </div>
</main>
</body>
</html>
